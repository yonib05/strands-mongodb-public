name: Release - TypeScript

# typescript/RELEASING.md is the procedure; typescript/test/__tests__/ci.test.ts reads this file as YAML
# and checks its structure. Every action is pinned to a digest, because the publish job holds a token.

on:
  push:
    tags:
      - 'typescript-v*'

permissions:
  contents: read

defaults:
  run:
    working-directory: typescript

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the gate
        run: npm run check

  build:
    name: Build and verify the artifact
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: The tag must be a semantic version
        run: |
          version="${GITHUB_REF_NAME#typescript-v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! printf '%s' "$version" | grep -Eq "$semver"; then
            echo "Tag $GITHUB_REF_NAME does not carry a semantic version after typescript-v"
            exit 1
          fi

      - name: Write the version from the tag
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#typescript-v}"

      - name: The packed version must equal the tag
        run: |
          version="${GITHUB_REF_NAME#typescript-v}"
          packed="$(npm pack --dry-run --json --ignore-scripts | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8"))[0].version)')"
          if [ "$packed" != "$version" ]; then
            echo "npm would pack $packed, the tag says $version"
            exit 1
          fi
          echo "npm packs $packed, matching $GITHUB_REF_NAME"

      - name: Build
        run: npm run build

      - name: Install the tarball into empty projects
        env:
          STRANDS_MONGODB_BUILD_TIER: '1'
        run: npm run test:build

      - name: Pack the tarball
        run: |
          mkdir -p "$RUNNER_TEMP/npm-dist"
          npm pack --pack-destination "$RUNNER_TEMP/npm-dist"

      - name: Upload the artifact for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: typescript-dist
          path: ${{ runner.temp }}/npm-dist/
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: [build]
    runs-on: ubuntu-latest
    # The budget starts after a reviewer approves the deployment, not when the run starts.
    timeout-minutes: 10

    # Where the required reviewers and the NPM_TOKEN secret live. A tag alone does not publish.
    environment:
      name: npm
      url: https://www.npmjs.com/package/strands-mongodb

    steps:
      - name: Download the artifact the build job verified
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: typescript-dist
          path: dist/

      # registry-url writes the .npmrc that reads NODE_AUTH_TOKEN.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # No --provenance: it requires a public source repository, and this one is private.
      # npm refuses a prerelease without a dist-tag, so one goes to `next` rather than `latest`.
      - name: Publish
        working-directory: dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tarball="$(ls strands-mongodb-*.tgz)"
          case "${GITHUB_REF_NAME#typescript-v}" in
            *-*) npm publish "./$tarball" --tag next ;;
            *) npm publish "./$tarball" ;;
          esac
