name: Release - TypeScript

# typescript/RELEASING.md is the procedure. typescript/test/__tests__/ci.test.ts checks this file's trigger, its
# permissions and what must pass before a publish. Every action is pinned to a digest: the publish job holds a token.

on:
  push:
    tags:
      - 'typescript-v*'

permissions:
  contents: read

defaults:
  run:
    working-directory: typescript

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Full history, so the step below can see whether main contains the tagged commit.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: The tagged commit must be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the gate
        run: npm run check

  contract:
    name: Contract tier
    # Not ubuntu-latest: MongoDB 8.x refuses to start on its 6.19 kernel (SERVER-125742).
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    services:
      mongodb:
        image: mongodb/mongodb-atlas-local:8
        ports:
          - 27017:27017
        # The image's own HEALTHCHECK: a ping answers before mongot is up.
        options: >-
          --health-cmd "/usr/local/bin/runner healthcheck"
          --health-interval 10s
          --health-timeout 60s
          --health-retries 20

    env:
      MONGODB_URI: mongodb://localhost:27017/?directConnection=true
      MONGODB_ATLAS_URI: mongodb://localhost:27017/?directConnection=true
      STRANDS_MONGODB_EXPECT_SEARCH: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the contract tier
        run: npm run test:contract

      - name: Run the integration tier
        run: npm run test:integration

      # Fails unless every release-gate item passed in the two tiers above.
      - name: Run the release gate over both tiers
        run: npm run test:gate:release

      - name: Assert the tiers left the working tree clean
        run: |
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "The tiers left files behind:"
            echo "$dirty"
            exit 1
          fi

  build:
    name: Build and verify the artifact
    needs: [gate, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: The tag must be a semantic version
        run: |
          version="${GITHUB_REF_NAME#typescript-v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! printf '%s' "$version" | grep -Eq "$semver"; then
            echo "Tag $GITHUB_REF_NAME does not carry a semantic version after typescript-v"
            exit 1
          fi

      - name: Write the version from the tag
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#typescript-v}"

      - name: The packed version must equal the tag
        run: |
          version="${GITHUB_REF_NAME#typescript-v}"
          packed="$(npm pack --dry-run --json --ignore-scripts | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8"))[0].version)')"
          if [ "$packed" != "$version" ]; then
            echo "npm would pack $packed, the tag says $version"
            exit 1
          fi
          echo "npm packs $packed, matching $GITHUB_REF_NAME"

      # `prepack` builds, so this is the only build and the only tarball of the run.
      - name: Pack the tarball
        run: |
          mkdir -p "$RUNNER_TEMP/npm-dist"
          npm pack --pack-destination "$RUNNER_TEMP/npm-dist"
          echo "STRANDS_MONGODB_TARBALL=$(ls "$RUNNER_TEMP"/npm-dist/strands-mongodb-*.tgz)" >> "$GITHUB_ENV"

      - name: Install that tarball into empty projects
        env:
          STRANDS_MONGODB_BUILD_TIER: '1'
        run: npm run test:build

      - name: Upload the artifact for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: typescript-dist
          path: ${{ runner.temp }}/npm-dist/
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: [build]
    runs-on: ubuntu-latest
    # The budget starts after a reviewer approves the deployment, not when the run starts.
    timeout-minutes: 10

    # Where the required reviewers and the NPM_TOKEN secret live. A tag alone does not publish.
    environment:
      name: npm
      url: https://www.npmjs.com/package/strands-mongodb

    steps:
      - name: Download the artifact the build job verified
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: typescript-dist
          path: dist/

      # registry-url writes the .npmrc that reads NODE_AUTH_TOKEN.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # No --provenance: it requires a public source repository, and this one is private.
      # npm refuses a prerelease without a dist-tag, so one goes to `next` rather than `latest`.
      - name: Publish
        working-directory: dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tarball="$(ls strands-mongodb-*.tgz)"
          case "${GITHUB_REF_NAME#typescript-v}" in
            *-*) npm publish "./$tarball" --tag next ;;
            *) npm publish "./$tarball" ;;
          esac
