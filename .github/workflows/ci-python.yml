name: CI - Python

# Five gates on a change and two jobs on the weekly cron or on demand. tests/test_ci.py reads this file
# as YAML and checks its structure.
#
# The contract and integration tiers run on every change against service containers, so they need no
# secret: this package opens no transaction, session or change stream, and the Atlas local image carries
# mongot. Only autoembed needs a real Atlas cluster, so the `atlas` job runs it, with integration again,
# on the schedule.

on:
  pull_request:
    # No `branches:` filter, deliberately. A pull request stacked on another topic branch would otherwise
    # run no gate job, and when its base merges GitHub retargets it with an `edited` event this workflow
    # does not receive, so it would never run one.
    paths:
      # Every file the suite asserts something about; a test fails when one is not listed. A change that
      # touches only an unlisted file runs no job, which looks the same as passing.
      - 'python/**'
      - '.github/workflows/ci-python.yml'
      - '.github/workflows/release-python.yml'
      - '.github/workflows/ci-typescript.yml'
      - '.github/dependabot.yml'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - 'SECURITY.md'
      - '.gitignore'
  push:
    # Push keeps the filter: a topic branch is already graded by its pull request, and the concurrency
    # group keys a push on the run id, so a second copy would not supersede the first.
    branches: [ main ]
    paths:
      # Every file the suite asserts something about; a test fails when one is not listed. A change that
      # touches only an unlisted file runs no job, which looks the same as passing.
      - 'python/**'
      - '.github/workflows/ci-python.yml'
      - '.github/workflows/release-python.yml'
      - '.github/workflows/ci-typescript.yml'
      - '.github/dependabot.yml'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - 'SECURITY.md'
      - '.gitignore'
  schedule:
    # Weekly canary against the newest SDK release. strands-agents has no upper bound, so a new user resolves
    # whatever is current; this sees a removed export or an added Protocol member first. The `floors` job
    # tests the other end of the range.
    - cron: '0 6 * * 1'
  # On demand, so the scheduled jobs can be run and debugged without waiting a week. Dispatch needs write
  # access and runs a ref already in the repository, so a fork cannot reach it. No `inputs:`: a dispatch
  # runs every job.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed on the event, because a push to main, a dispatch and the cron share the same `github.ref`; on the
  # ref alone a merge would cancel a running `Atlas tiers` job. Pull requests key on their number, and
  # everything else on the run id, so two dispatches do not cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  # Cancel only for a pull request, where a new push makes the old run moot. A push, a dispatch and the cron
  # grade a commit already on main, and cancelling would leave that commit with no result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: python

jobs:
  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Every job declares a budget, because GitHub's default is six hours and a hung network read would
    # spend all of it. Each is tight enough that a hang fails and loose enough for a slow runner.
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Otherwise `actions/checkout` leaves its token in `.git/config`, readable by every later step.
          # Nothing in either workflow pushes, tags or comments. Every checkout in both files sets this.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install hatch
        run: pip install hatch

      # `hatch build` and the tests do not check the manifest against PyPI's schemas. The release gate runs
      # this too; running it here catches a defect before a tag exists.
      - name: Validate the manifest
        run: |
          pip install --quiet validate-pyproject
          validate-pyproject pyproject.toml

      # format-check, not format. `hatch run format` is `ruff format`, which rewrites the checkout and
      # exits 0, so a job built on it reports success on unformatted code. `format-check` is
      # `ruff format --check`, which exits 1 and changes nothing.
      - name: Check formatting
        run: hatch run format-check

      - name: Run linter
        run: hatch run lint

      - name: Type check
        run: hatch run typecheck

  test:
    name: Test - Python ${{ matrix.python-version }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Quoted, because unquoted 3.10 is the float 3.1 in YAML. A test requires this list to equal the
        # Python version classifiers in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install hatch
        run: pip install hatch

      # No tier variable is set, so this is the unit tier: the three tiers that need a backend skip and
      # say which variable was missing.
      - name: Run tests
        run: hatch run test

  # The other end of the range `sdk-compat` tests: every declared floor, installed and run against. A floor
  # is what a user's resolver reads, and one set too low ships a package that cannot be imported.
  floors:
    name: Dependency floors
    # On a change rather than on the schedule: a floor stops being true when this package adds an import,
    # and nothing upstream can break it.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          # Quoted, as in the matrix. The oldest interpreter, because an old Python is what usually resolves
          # a user to the floors. A test compares this against `requires-python`.
          python-version: "3.10"
          cache: 'pip'

      # Written out rather than generated, so the pinned set is visible in the diff and the log. A test
      # requires every floor in pyproject.toml to appear here.
      - name: Pin every declared floor
        run: |
          cat > "${RUNNER_TEMP}/floors.txt" <<'EOF'
          strands-agents==1.54.0
          pymongo==4.14.0
          typing-extensions==4.13.2
          opentelemetry-api==1.30.0
          pymongo-search-utils==0.3.0
          EOF
          cat "${RUNNER_TEMP}/floors.txt"
          # pip and uv read these on every install, including the ones hatch makes, so `hatch run test` runs
          # against the pinned set. Under `$RUNNER_TEMP` so the working tree stays clean.
          #
          # Exported from a step, not a job-level `env:`: the `runner` context is not available there, and
          # naming it fails the whole run at startup with no job and no log.
          {
            echo "PIP_CONSTRAINT=${RUNNER_TEMP}/floors.txt"
            echo "UV_CONSTRAINT=${RUNNER_TEMP}/floors.txt"
          } >> "$GITHUB_ENV"

      - name: Install hatch
        run: pip install hatch

      - name: Show what resolved
        run: hatch run pip list

      # Running the tests, not just installing, is what shows the package works on its floors.
      - name: Run tests against the floors
        run: hatch run test

  contract:
    name: Contract tier (${{ matrix.deployment.label }})
    if: github.event_name != 'schedule'
    # Not ubuntu-latest: from runner image 20261025 its kernel is 6.19 or newer, where MongoDB 8.x refuses to
    # start (log id 12257600, SERVER-125742). ubuntu-22.04 runs kernel 6.8. Move back once MongoDB lifts the guard.
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    # Two deployments, because `mongo:8` has no search process and the Atlas local image does, so the tests
    # that branch on search capability cover both sides only across the two. `fail-fast: false` because the
    # legs check different things.
    strategy:
      fail-fast: false
      matrix:
        deployment:
          - label: mongod alone
            image: mongo:8
            # Its own `mongosh`, which is in that image.
            health: "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
            uri: mongodb://localhost:27017
            expect_search: ''
          - label: with a search process
            image: mongodb/mongodb-atlas-local:8
            # The image's own HEALTHCHECK command rather than a ping, which answers before mongot is up.
            # GitHub's service options replace the image's declaration, so it is named here.
            health: /usr/local/bin/runner healthcheck
            # `directConnection=true`, as MongoDB's Docker instructions give for this image. It is a
            # single-node replica set whose member host is the container's hostname, which the runner
            # cannot resolve; without it every operation times out in server selection.
            uri: mongodb://localhost:27017/?directConnection=true
            expect_search: '1'

    # A real MongoDB from the runner rather than a secret. Nothing in this package needs a replica set.
    services:
      mongodb:
        image: ${{ matrix.deployment.image }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "${{ matrix.deployment.health }}"
          --health-interval 10s
          --health-timeout 60s
          --health-retries 20

    # Under env: rather than on the command line, the rule for every connection string, secret or not.
    env:
      MONGODB_URI: ${{ matrix.deployment.uri }}
      # `1` on the leg with a search process. Tests that branch on search capability fail, rather than
      # take the other branch, when the deployment does not match.
      STRANDS_MONGODB_EXPECT_SEARCH: ${{ matrix.deployment.expect_search }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install hatch
        run: pip install hatch

      # -m contract rather than the whole suite: the matrix runs the unit tier. This also runs the storage
      # example, which carries the `contract` marker.
      - name: Run the contract tier
        run: hatch run test -m contract

      # The integration tier needs mongot, which only the Atlas local image carries, so it runs on every
      # change on that leg instead of against a cloud cluster. `autoembed` stays with the Atlas job below:
      # automated embedding needs an Atlas cluster.
      - name: Run the integration tier
        if: matrix.deployment.expect_search == '1'
        env:
          MONGODB_ATLAS_URI: ${{ matrix.deployment.uri }}
        run: hatch run test -m integration

      # Anything the run left that git can see is either missing from `.gitignore` or an example writing
      # into the user's working tree.
      - name: Assert the tier left the working tree clean
        run: |
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "The contract tier left files behind:"
            echo "$dirty"
            exit 1
          fi

  coverage:
    name: Coverage floors
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The build tier: builds a wheel and an sdist and installs from PyPI, so it needs only network. Here
    # rather than in the matrix because the artifact is the same on every interpreter.
    env:
      STRANDS_MONGODB_BUILD_TIER: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install hatch
        run: pip install hatch

      # The 90% aggregate and 70% per-module floors, met by the unit tier alone, so no credential is
      # needed. Not part of `test`, so this job is what enforces them.
      - name: Enforce both coverage floors
        run: hatch run cov

  sdk-compat:
    name: Latest SDK compatibility
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Not ubuntu-latest: from runner image 20261025 its kernel is 6.19 or newer, where MongoDB 8.x refuses to
    # start (log id 12257600, SERVER-125742). ubuntu-22.04 runs kernel 6.8. Move back once MongoDB lifts the guard.
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    # The same container the contract job uses, so the canary runs the contract tier with no secret.
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://localhost:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install hatch
        run: pip install hatch

      - name: Update SDK to latest
        run: |
          hatch run pip install --upgrade strands-agents
          hatch run pip show strands-agents

      # The store is assigned to the SDK's Protocol types under mypy, so a member added upstream fails here.
      - name: Type check
        run: hatch run typecheck

      - name: Run the compat tier
        run: hatch run test -m compat

      # A separate step rather than `-m "compat or contract"`, so a failure names which one broke. No other
      # job runs the upgraded SDK against a real server.
      - name: Run the contract tier against the upgraded SDK
        run: hatch run test -m contract

      # As in the `contract` job, since a new SDK release could start writing somewhere new.
      - name: Assert the tier left the working tree clean
        run: |
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "The contract tier left files behind:"
            echo "$dirty"
            exit 1
          fi

  atlas:
    name: Atlas tiers
    # The weekly cron and a manual dispatch only. Every run creates a billed cluster, and a fork's pull
    # request receives no secret, so it would only ever skip. Before a release, dispatch this workflow on
    # the commit to be tagged and wait for this job.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # About ten minutes to create an M10, up to forty for the two tiers, and the teardown.
    timeout-minutes: 75
    # One cluster at a time, so the reaper in `up` can never delete a cluster another run is still using.
    concurrency:
      group: atlas-ci-cluster
      cancel-in-progress: false

    env:
      # Named from the run before anything is created, so the teardown step can delete it even when
      # `up` fails half way.
      ATLAS_CI_CLUSTER: sm-ci-${{ github.run_id }}-${{ github.run_attempt }}
      DO_NOT_TRACK: '1'
      MONGODB_ATLAS_SKIP_UPDATE_CHECK: 'yes'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install hatch
        run: pip install hatch

      # A pinned release, verified against the checksum MongoDB publishes for it.
      - name: Install the Atlas CLI
        env:
          ATLAS_CLI_VERSION: 1.49.0
          ATLAS_CLI_SHA256: 045948133107b87f4b3af670ab3931f8a7ac82e5fbe21204943adb336d5e11d4
        run: |
          archive="mongodb-atlas-cli_${ATLAS_CLI_VERSION}_linux_x86_64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/mongodb/mongodb-atlas-cli/releases/download/atlascli%2Fv${ATLAS_CLI_VERSION}/${archive}"
          echo "${ATLAS_CLI_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/mongodb-atlas-cli_${ATLAS_CLI_VERSION}_linux_x86_64/bin" >> "$GITHUB_PATH"

      # The service account needs the Project Owner role on the project, which is what creating a
      # cluster takes. CONTRIBUTING.md describes the setup.
      - name: Create the cluster
        id: cluster
        env:
          MONGODB_ATLAS_CLIENT_ID: ${{ secrets.ATLAS_CLIENT_ID }}
          MONGODB_ATLAS_CLIENT_SECRET: ${{ secrets.ATLAS_CLIENT_SECRET }}
          MONGODB_ATLAS_PROJECT_ID: ${{ secrets.ATLAS_PROJECT_ID }}
        run: hatch run python scripts/atlas_ci_cluster.py up

      - name: Run the tiers that need a cluster
        env:
          MONGODB_ATLAS_URI: ${{ steps.cluster.outputs.uri }}
          MONGODB_AUTOEMBED_URI: ${{ steps.cluster.outputs.uri }}
        run: hatch run test -m "integration or autoembed"

      - name: Delete the cluster
        if: always()
        env:
          MONGODB_ATLAS_CLIENT_ID: ${{ secrets.ATLAS_CLIENT_ID }}
          MONGODB_ATLAS_CLIENT_SECRET: ${{ secrets.ATLAS_CLIENT_SECRET }}
          MONGODB_ATLAS_PROJECT_ID: ${{ secrets.ATLAS_PROJECT_ID }}
        run: hatch run python scripts/atlas_ci_cluster.py down
