name: Release - Python

# Trusted publishing over OIDC: no API token exists in this repository. PyPI verifies this workflow file,
# in this repository, running in the `pypi` environment, and mints a token good for one upload. Renaming
# the file or the environment breaks the upload until the publisher on PyPI is updated to match.
#
# tests/test_release_ci.py reads this file as YAML and checks its structure.

on:
  push:
    tags:
      # The tag pattern `pyproject.toml`'s `tag_regex` derives the version from. A `typescript-v*` tag
      # versions independently off the same repo and must not reach this workflow.
      - 'python-v*'

# Read-only by default. A job that names any scope gets `none` for every scope it does not name.
permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    # Every job has a budget well under GitHub's six-hour default; see the note on `publish`.
    timeout-minutes: 20  # The whole unit tier on one interpreter, plus the gate's own checks.

    # The build tier runs here, on one interpreter, because the artifact is the same on all of them.
    # No MONGODB_URI, deliberately: `hatch run cov` would then also run the contract tier, which has its
    # own job below, and the coverage number would differ from the one `ci-python.yml` measures.
    env:
      STRANDS_MONGODB_BUILD_TIER: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # hatch-vcs reads the tag from git metadata. A shallow clone has no tags, so the version would
          # fall back to 0.0.0.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          # No `cache: 'pip'` here, unlike the CI workflow. zizmor flags a cached release job as a
          # cache-poisoning path: the thing that signs and publishes should not restore state that
          # another workflow wrote. The confidence is low, because GitHub scopes a pull request's
          # cache away from a tag's, but a release runs rarely and installs little, so the cache was
          # buying almost nothing. Removing it is cheaper than reasoning about scope rules.

      - name: Install hatch
        run: pip install hatch

      # `hatch build` accepts metadata that PyPI refuses at upload. This check is fast, so it runs first.
      - name: Validate the manifest
        run: |
          pip install --quiet validate-pyproject
          validate-pyproject pyproject.toml

      - name: Check formatting
        run: hatch run format-check

      - name: Run linter
        run: hatch run lint

      - name: Type check
        run: hatch run typecheck

      # Both coverage floors, which run the unit tier on the way through.
      - name: Enforce both coverage floors
        run: hatch run cov

  contract:
    name: Contract tier
    # Not ubuntu-latest: from runner image 20261025 its kernel is 6.19 or newer, where MongoDB 8.x refuses to
    # start (log id 12257600, SERVER-125742). ubuntu-22.04 runs kernel 6.8. Move back once MongoDB lifts the guard.
    runs-on: ubuntu-22.04
    timeout-minutes: 15  # A container start plus the contract tier, as in CI.

    # A service container rather than a cluster secret: a release workflow holding a cluster credential
    # would bring back the long-lived secret that trusted publishing removes.
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    # Under env: rather than on the command line, the rule for every connection string, secret or not.
    env:
      MONGODB_URI: mongodb://localhost:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          # No `cache: 'pip'` here, unlike the CI workflow. zizmor flags a cached release job as a
          # cache-poisoning path: the thing that signs and publishes should not restore state that
          # another workflow wrote. The confidence is low, because GitHub scopes a pull request's
          # cache away from a tag's, but a release runs rarely and installs little, so the cache was
          # buying almost nothing. Removing it is cheaper than reasoning about scope rules.

      - name: Install hatch
        run: pip install hatch

      # `-m contract` rather than a bare `hatch run test`: without the selector an unreachable server
      # reports the tier as skipped, and a skip looks like a pass.
      - name: Run the contract tier
        run: hatch run test -m contract

      # `build` checks out afresh, but a tier that writes into the tree could write into what gets
      # packaged.
      - name: Assert the tier left the working tree clean
        run: |
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "The contract tier left files behind:"
            echo "$dirty"
            exit 1
          fi

  build:
    name: Build and verify the artifact
    needs: [gate, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 15  # A build of both artifacts and the checks that they are the right ones.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          # No `cache: 'pip'` here, unlike the CI workflow. zizmor flags a cached release job as a
          # cache-poisoning path: the thing that signs and publishes should not restore state that
          # another workflow wrote. The confidence is low, because GitHub scopes a pull request's
          # cache away from a tag's, but a release runs rarely and installs little, so the cache was
          # buying almost nothing. Removing it is cheaper than reasoning about scope rules.

      - name: Install hatch
        run: pip install hatch

      - name: Build the wheel and the sdist
        run: hatch build

      # Compared as PEP 440 versions, not strings, so `python-v0.1.0-rc1` and `python-v0.1.0rc1` match.
      # A mismatch means hatch-vcs saw a dirty tree or no tag, and would publish a `.dev` or `0.0.0`.
      - name: The built version must equal the tag
        run: |
          python -m pip install --quiet packaging
          python - <<'PY'
          import os, pathlib, sys
          from packaging.utils import parse_wheel_filename
          from packaging.version import Version

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("python-v")
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              sys.exit(f"expected exactly one wheel in dist/, found {[w.name for w in wheels]}")
          built = parse_wheel_filename(wheels[0].name)[1]
          if built != Version(tag):
              sys.exit(f"wheel is {built}, tag says {Version(tag)} ({wheels[0].name})")
          print(f"{wheels[0].name} matches tag {tag}")
          PY

      # `--strict`: without it `twine check` only warns about an unrenderable description and exits 0.
      # The metadata cannot be changed after upload.
      - name: The artifacts must render on PyPI
        run: |
          pip install --quiet twine
          twine check --strict dist/*

      - name: Upload the artifact for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    # `sign`, not `build`: an artifact that was not signed can never reach PyPI, because the job that
    # uploads it does not run until the job that signs it has succeeded.
    needs: sign
    runs-on: ubuntu-latest
    # This does not cut the approval short: the budget starts when the job starts, after a reviewer
    # approves. GitHub cancels an unapproved run after thirty days on its own clock.
    timeout-minutes: 10

    # The environment PyPI's publisher is bound to, and where the required reviewers live. A tag alone
    # does not publish: a person approves the deployment first.
    environment:
      name: pypi
      url: https://pypi.org/p/strands-mongodb

    permissions:
      # The OIDC token PyPI exchanges for a one-upload credential.
      id-token: write

    steps:
      # Every action in this file is pinned to a digest, and a test asserts it for each job holding
      # `id-token: write`.
      - name: Download the artifact the build job verified
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-dist
          path: dist/

      # No `password:`. Trusted publishing supplies the credential; supplying a token here would defeat
      # the point of the environment binding above.
      # `release/v1` is a branch, and whoever can move it could change what runs with the upload
      # credential. The digest is the same pin `mongo-python-driver` uses for this action.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          packages-dir: dist/

  # ---------------------------------------------------------------------------------------------
  # ABX SSDLC steps. `sign` is required; the Kondukto augmentation inside `sbom`, and `trace`
  # entirely, are gated on repository variables and skip cleanly until the credentials behind them
  # are provisioned. The actions come from `mongodb-labs/abx-release-tools`, hash-pinned: a tag or a
  # branch there could be moved by anyone with write access to that repository, and these jobs hold
  # `id-token: write`.
  # ---------------------------------------------------------------------------------------------

  sign:
    name: Sign the artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15  # A container pull, three signatures, and the AWS round trip.

    # A credential scope, not an approval gate, so this environment carries no required reviewers.
    # `pypi` is where a human approves; two prompts for one release would train people to click through.
    environment:
      name: release-signing

    permissions:
      # Exchanged for the AWS role that reads the Garasign credentials out of Secrets Manager.
      id-token: write

    steps:
      # Every action in this job is pinned to a digest because the job holds `id-token: write`.
      - name: Download the artifact the build job verified
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-dist
          path: dist/

      # Over the two files that will be published, computed here rather than in `build`: anything
      # left in the build job's `dist/` is uploaded as part of `python-dist`, and the publish action
      # offers PyPI everything it finds in the directory it is handed.
      - name: Checksum the wheel and the sdist
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # The role ARN, the region and the *name* of a secret. None of the three is a credential: the
      # credential is the OIDC token minted for this job, which is why this job is environment-bound.
      - name: Set up the release environment
        uses: mongodb-labs/abx-release-tools/actions/setup@9d8e5070f37497b4d2d0239c80d65eacc096fdbc
        with:
          aws_role_arn: ${{ vars.AWS_SIGNING_ROLE_ARN }}
          aws_region_name: ${{ vars.AWS_SIGNING_REGION }}
          aws_secret_id: ${{ vars.AWS_SIGNING_SECRET_ID }}

      # Newline-separated: the space-separated form cannot express a filename containing a space,
      # and a pattern that matches nothing is an error rather than a quietly unsigned artifact.
      - name: Sign the artifacts
        uses: mongodb-labs/abx-release-tools/actions/gpg-sign@9d8e5070f37497b4d2d0239c80d65eacc096fdbc
        with:
          filenames: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS

      # The signatures are moved to RELEASE_ASSETS by the action; SHA256SUMS itself is not, and the
      # GitHub Release needs both.
      - name: Collect the signatures and the checksums
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cp -- dist/SHA256SUMS "$RELEASE_ASSETS/"
          ls -l "$RELEASE_ASSETS"

      - name: Upload the signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: python-signatures
          path: ${{ env.RELEASE_ASSETS }}
          if-no-files-found: error

  github-release:
    name: Attach the signatures to the GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      # Creating the Release and uploading assets to it. No OIDC here: this job mints no credential.
      contents: write

    steps:
      - name: Download the artifact that was published
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-dist
          path: release/

      - name: Download the signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-signatures
          path: release/

      # `gh release create` is idempotent only in the sense that it fails if the release exists, so
      # the existence check comes first. A signature nobody can download does not meet the intent of
      # the signing guide, which is why this job exists at all.
      - name: Create the release if it does not exist, then attach everything
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          # `gh` infers the repository from a git remote, and this job checks nothing out -- it only
          # downloads artifacts. Without GH_REPO every `gh` call below fails with
          # `none of the git remotes configured for this repository point to a known GitHub host`.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # A PEP 440 prerelease is only a prerelease to PyPI: GitHub reads nothing from the
            # version and would list `python-v1.0.0.dev1` as the latest release, ahead of the last
            # stable one. Anything beyond digits and dots -- `.dev1`, `rc1`, `a2`, `+local` -- is
            # not a final release, so it is marked as one here too.
            version="${TAG#python-v}"
            prerelease=()
            case "$version" in
              *[!0-9.]*) prerelease=(--prerelease) ;;
            esac
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "Release $TAG" \
              ${prerelease[@]+"${prerelease[@]}"}
          fi
          # Named, not globbed: RELEASE_ASSETS also holds `release_run_id.txt`, which is neither
          # signed nor listed in SHA256SUMS.
          gh release upload "$TAG" --clobber \
            release/*.tar.gz release/*.tar.gz.sig \
            release/*.whl release/*.whl.sig \
            release/SHA256SUMS release/SHA256SUMS.sig

  sbom:
    name: Generate the SBOM
    needs: github-release
    # Not gated: a CycloneDX SBOM needs no credential and no vendor, so every release ships one.
    # Only the augmentation in `sbom-publish` waits on Kondukto.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # Installing the `all` extra runs its dependencies' build hooks, so this job holds no credential.
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # The SBOM is generated from an installed copy of the project, so hatch-vcs resolves the
          # version here too. A shallow clone has no tag and the SBOM would name a `.dev` version.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Generate the CycloneDX SBOM
        env:
          SBOM_TOOL: ${{ runner.temp }}/sbom-tool
          SBOM_ENV: ${{ runner.temp }}/sbom-env
        run: |
          set -euo pipefail
          # `cyclonedx-py environment` reports the interpreter it is handed, so the tool gets its own.
          python -m venv "$SBOM_TOOL"
          "$SBOM_TOOL/bin/python" -m pip install --quiet cyclonedx-bom

          # `.[all]`, not `.`: `dependencies` in pyproject.toml is empty, so a bare install carries
          # metadata alone. `[all]` is every runtime dependency a consumer can install.
          python -m venv "$SBOM_ENV"
          "$SBOM_ENV/bin/python" -m pip install --quiet '.[all]'

          "$SBOM_TOOL/bin/cyclonedx-py" environment "$SBOM_ENV/bin/python" \
            --pyproject pyproject.toml --mc-type library \
            --output-format json --output-file sbom.json
          test -s sbom.json

      # `--pyproject` makes this package the root component, read from pyproject.toml, where the
      # version is `dynamic`. cyclonedx-py has no option to supply it, so the root would name no
      # version and no purl, and a scanner could not tell which release the document describes. Both
      # come from the installed metadata, which hatch-vcs derived from the tag.
      - name: Name the release in the SBOM's root component
        env:
          SBOM_ENV: ${{ runner.temp }}/sbom-env
        run: |
          set -euo pipefail
          version="$("$SBOM_ENV/bin/python" -c 'import importlib.metadata as m; print(m.version("strands-mongodb"))')"
          # A local segment is what hatch-vcs produces when it cannot see the tag. That version was
          # never published, and an SBOM filed under it describes nothing anyone can install.
          case "$version" in
            *+*) echo "::error::installed version $version was not derived from the tag"; exit 1 ;;
          esac
          python - "$version" <<'EOF'
          import json
          import sys

          version = sys.argv[1]
          with open("sbom.json", encoding="utf-8") as f:
              bom = json.load(f)
          # `bom-ref` stays: it is what the dependency graph points at.
          root = bom["metadata"]["component"]
          root["version"] = version
          root["purl"] = f"pkg:pypi/strands-mongodb@{version}"
          with open("sbom.json", "w", encoding="utf-8") as f:
              json.dump(bom, f, indent=2)
              f.write("\n")
          EOF
          test -s sbom.json

      - name: Upload the SBOM for the publishing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: python-sbom
          path: python/sbom.json
          if-no-files-found: error

  sbom-publish:
    name: Augment and attach the SBOM
    needs: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: release-signing

    permissions:
      id-token: write
      # Attaching the SBOM to the Release `github-release` created. Declaring `id-token` alone sets
      # every other scope to `none`, so the upload at the end of this job would 403 without it.
      contents: write

    steps:
      - name: Download the generated SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-sbom
          path: sbom/

      # The three steps below are the augmentation, each gated on the same variable, so turning
      # Kondukto on or off is a repository setting rather than a code change.
      - name: Set up the release environment
        if: vars.KONDUKTO_SECRET_ID != ''
        uses: mongodb-labs/abx-release-tools/actions/setup@9d8e5070f37497b4d2d0239c80d65eacc096fdbc
        with:
          aws_role_arn: ${{ vars.AWS_SIGNING_ROLE_ARN }}
          aws_region_name: ${{ vars.AWS_SIGNING_REGION }}
          aws_secret_id: ${{ vars.KONDUKTO_SECRET_ID }}

      - name: Augment the SBOM
        if: vars.KONDUKTO_SECRET_ID != ''
        uses: mongodb-labs/abx-release-tools/actions/sbom@9d8e5070f37497b4d2d0239c80d65eacc096fdbc
        with:
          sbom_in_path: sbom/sbom.json

      # One asset name either way, so a consumer looks in one place. Whether the SBOM was augmented
      # shows in its contents.
      - name: Collect the SBOM that will be attached
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p release
          if [ -n "${RELEASE_ASSETS:-}" ] && [ -s "$RELEASE_ASSETS/cyclonedx.sbom.json" ]; then
            cp -- "$RELEASE_ASSETS/cyclonedx.sbom.json" release/cyclonedx.sbom.json
          else
            cp -- sbom/sbom.json release/cyclonedx.sbom.json
          fi
          test -s release/cyclonedx.sbom.json

      - name: Attach the SBOM to the release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          # This job checks nothing out, so `gh` has no remote to infer the repository from.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release/cyclonedx.sbom.json --clobber

      # For `trace`, which records and stores the SBOM a consumer downloads. That is this one, not
      # `python-sbom`: when Kondukto is configured the two differ.
      - name: Hand the attached SBOM to the trace job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: python-sbom-attached
          path: release/cyclonedx.sbom.json
          if-no-files-found: error

  trace:
    name: Record the authorized publication
    # See Guide 3: Artifact tracing
    needs: [publish, sbom-publish]
    if: vars.AWS_RELEASE_BUCKET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: release-signing

    permissions:
      id-token: write

    steps:
      - name: Download the artifact that was published
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-dist
          path: ${{ github.workspace }}

      - name: Download the signatures and the checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-signatures
          path: ${{ github.workspace }}

      - name: Download the SBOM the Release carries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-sbom-attached
          path: ${{ github.workspace }}

      - name: The version this run published
        id: version
        working-directory: ${{ github.workspace }}
        run: echo "value=${GITHUB_REF_NAME#python-v}" >> "$GITHUB_OUTPUT"

      - name: Set up the release environment
        uses: mongodb-labs/abx-release-tools/actions/setup@9d8e5070f37497b4d2d0239c80d65eacc096fdbc
        with:
          aws_role_arn: ${{ vars.AWS_SIGNING_ROLE_ARN }}
          aws_region_name: ${{ vars.AWS_SIGNING_REGION }}
          aws_secret_id: ${{ vars.AWS_SIGNING_SECRET_ID }}

      - name: Write the authorized publication report
        uses: mongodb-labs/abx-release-tools/actions/authorized-pub@9d8e5070f37497b4d2d0239c80d65eacc096fdbc
        with:
          product_name: strands-mongodb
          release_version: ${{ steps.version.outputs.value }}
          token: ${{ github.token }}
          filenames: |
            *.whl
            *.whl.sig
            *.tar.gz
            *.tar.gz.sig
            SHA256SUMS
            SHA256SUMS.sig
            cyclonedx.sbom.json

      # `upload-s3-assets` uploads what is in `$S3_ASSETS`, where the report already is. The SBOM
      # joins it: two of the four files pymongo keeps per version. The compliance report and the
      # code-scanning alerts have no action yet.
      - name: Put the SBOM beside the report
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cp -- cyclonedx.sbom.json "$S3_ASSETS/"
          ls -l "$S3_ASSETS"

      - name: Upload the report and the SBOM to S3
        uses: mongodb-labs/abx-release-tools/actions/upload-s3-assets@9d8e5070f37497b4d2d0239c80d65eacc096fdbc
        with:
          version: ${{ steps.version.outputs.value }}
          product_name: strands-mongodb
