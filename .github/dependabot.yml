# Actions, and the development dependencies of the TypeScript package.
#
# Every `uses:` in `.github/workflows/` is third-party code running with its job's permissions. The
# publishing job pins its actions to a digest, and a digest never moves, including away from a
# vulnerability. This file is what moves it.
#
# `cooldown` waits a week before proposing an upgrade, because a compromised action release is usually
# yanked within days of publication.
#
# There is deliberately no `pip` entry. The package's dependencies are floors (`>=`, no upper bound),
# and raising a floor drops support for users on older releases. That is a decision about the support
# window, so nothing should open it automatically. A test asserts the entry is absent. The `npm` entry
# below is limited to development dependencies for the same reason: the peer ranges are floors.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # One PR for the whole set: the same suite gates them either way, and one PR is one CI run.
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "npm"
    directory: "/typescript"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "development"
    groups:
      npm-development:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
