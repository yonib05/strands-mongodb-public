# zizmor configuration. See .github/workflows/zizmor.yml for how it runs.
#
# An entry here is an argued exception, not a way to quiet a finding. Each one says what the rule is
# right about in general and why this particular use is not the thing it is looking for.
rules:
  unpinned-images:
    ignore:
      # The MongoDB server images for the integration matrix, as `services:` containers.
      #
      # The rule is right that a mutable tag can change under you. These are disposable test
      # fixtures, though: they hold no credentials, receive no secrets, and produce nothing that
      # reaches a release. Pinning them to digests would mean a Dependabot PR per server image for a
      # matrix whose whole purpose is to track what MongoDB currently ships, and would quietly stop
      # testing against the server a user would actually install.
      #
      # The release workflow is the opposite case, and is digest-pinned throughout. A test asserts
      # that every action in a job holding `id-token: write` is pinned to a 40-character digest.
      - ci-python.yml
      - ci-typescript.yml
  unpinned-uses:
    ignore:
      # The integration matrix's actions, referenced by version tag rather than commit digest.
      #
      # The rule is right that a tag is mutable and a compromised release would be picked up
      # silently. The judgement is per job, and this file-level ignore covers only the jobs that
      # receive nothing: they mint no token and publish nothing, so the worst a bad action version
      # can do is lie about a test result. The release workflow, which signs and publishes, is
      # digest-pinned throughout and has a test asserting it stays that way.
      #
      # The exception inside this file is the `atlas` job, which receives the Atlas service account
      # and can create and delete clusters with it. Its actions are digest-pinned in place, because
      # a moved tag there reaches a real credential. zizmor's ignore list is per file, so that
      # pinning is a convention this comment records rather than something the ignore enforces.
      #
      # Digest-pinning the whole matrix would mean a Dependabot PR per action per bump across a dozen
      # jobs, which is how pinning stops being read and starts being rubber-stamped.
      - ci-python.yml
      # The same judgement, and the same digest-pinned `atlas` job.
      - ci-typescript.yml
  adhoc-packages:
    ignore:
      # `npm install @strands-agents/sdk@latest` in the `sdk-compat` job.
      #
      # The rule is right that an install outside the lockfile is unreviewed. Here that is the point:
      # the job exists to find out whether the SDK release nobody has pinned yet still type-checks
      # against this package. It holds no secret and publishes nothing.
      - ci-typescript.yml
  use-trusted-publishing:
    ignore:
      # `npm publish` with a token in the `publish` job.
      #
      # The rule is right that OIDC is better than a long-lived token. npm configures a trusted
      # publisher on a package that already exists, and this one has not had its first release.
      # typescript/RELEASING.md records the switch to make once it has.
      - release-typescript.yml
