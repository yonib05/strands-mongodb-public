[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "strands-mongodb"
dynamic = ["version"]
description = "MongoDB storage and memory backends for the Strands Agents SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "MongoDB, Inc." }]
keywords = [
    "strands",
    "strands-agents",
    "mongodb",
    "atlas",
    "vector-search",
    "storage",
    "memory",
    "agent",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]

# Intentionally empty. Every runtime dependency belongs to the extra that needs it, so
# `pip install strands-mongodb[storage]` never pulls vector-search machinery. A bare
# `pip install strands-mongodb` is metadata only and imports of the backends fail with an
# actionable message (see src/strands_mongodb/_extras.py).
dependencies = []

[project.optional-dependencies]
# strands-agents 1.54.0 is the first release with every module `storage.py` imports, including
# `strands.storage.search.keyword`; older releases fail `import strands_mongodb.storage`. Both extras
# share the floor so `[all]` cannot resolve to a split pair. The `Dependency floors` CI job installs
# every floor and runs the suite against it.
#
# No upper bounds, matching strands-dynamodb-storage and the official extension template. A ceiling
# would hide from users that a new SDK release broke the protocol this package claims to satisfy. The
# weekly `sdk-compat` job and the test matrix both resolve the latest release to catch that instead.
#
# pymongo 4.14.0 added `AsyncMongoClient.append_metadata`, which `_client.py` calls on an injected
# client. On older drivers the attribute resolves to a `Database` and the call raises.
#
# typing-extensions is declared because `types.py` imports `Required` from it (`typing.Required` is
# 3.11+). The floor matches strands-agents', so no resolution changes.
storage = [
    "strands-agents>=1.54.0",
    "pymongo>=4.14.0",
    "typing-extensions>=4.13.2",
    # `_telemetry` imports it directly. The floor is strands-agents'. The SDK and exporters stay the
    # application's choice.
    "opentelemetry-api>=1.30.0",
]
memory = [
    "strands-agents>=1.54.0",
    "pymongo>=4.14.0",
    "typing-extensions>=4.13.2",
    # As in `storage`.
    "opentelemetry-api>=1.30.0",
    # Atlas $vectorSearch / $search stage builders, maintained by MongoDB.
    "pymongo-search-utils>=0.3.0",
]
all = ["strands-mongodb[memory,storage]"]
dev = [
    "pytest>=8.0.0,<9.0.0",
    # Floor at 1.0: 0.26 calls `asyncio.get_event_loop_policy()` (deprecated in 3.14) on every async
    # test, and `filterwarnings` below makes that an error, so the suite cannot run below 1.0.
    "pytest-asyncio>=1.0.0,<2.0.0",
    # Measures the 90% aggregate coverage floor that `hatch run cov` enforces.
    "pytest-cov>=5.0.0,<8.0.0",
    "ruff>=0.11.0,<1.0.0",
    "mypy>=1.15.0,<2.0.0",
    # The CI tests parse the workflow files. Declared even though strands-agents currently pulls it in,
    # because the tests import it directly.
    "pyyaml>=6.0.0",
    # PyYAML ships no annotations; the stubs let mypy check the workflow tests at full strictness.
    "types-PyYAML>=6.0.0",
    # The tests build a real span pipeline. Test-only: the runtime extras name only `opentelemetry-api`.
    "opentelemetry-sdk>=1.30.0",
    # Several tests parse this file, and `tomllib` is 3.11+, so 3.10 imports `tomli as tomllib`.
    #
    # Deliberately NOT marked `python_version < '3.11'`. mypy runs at `python_version = "3.10"` and reads
    # the `tomli` branch on every interpreter; without the package installed it resolves to `Any` and
    # every `tomllib.load` result goes unchecked. This is a dev extra, so no user installs it.
    "tomli>=2.0.0",
]

[project.urls]
# The repository PyPI's trusted publisher is bound to. `mongodb`, not `mongodb-labs`: the package is
# supported.
Homepage = "https://github.com/mongodb/strands-mongodb"
Repository = "https://github.com/mongodb/strands-mongodb"
Issues = "https://github.com/mongodb/strands-mongodb/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# The git repo root is one level up: this is a monorepo whose `python/` directory is a
# sibling of a future `typescript/`.
root = ".."
# Release tags are `python-v0.1.0`, so the python and typescript artifacts version
# independently off the same repo.
tag_regex = "^python-v(?P<version>.+)$"
version_scheme = "release-branch-semver"
# setuptools-scm refuses a non-default `root` without a reference file; pyproject.toml is
# always next to itself.
relative_to = "pyproject.toml"
# Only reached when building from a source tree with no git metadata (e.g. a zip download).
# Deliberately unmistakable so such a build is never mistaken for a release.
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/strands_mongodb"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "examples",
    "README.md",
    "MIGRATION.md",
    # So a source download says what changed between versions.
    "CHANGELOG.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]

[tool.hatch.envs.default]
features = ["all"]
dependencies = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "ruff>=0.11.0,<1.0.0",
    "mypy>=1.15.0,<2.0.0",
    "pyyaml>=6.0.0",
    "types-PyYAML>=6.0.0",
    "opentelemetry-sdk>=1.30.0",
    "tomli>=2.0.0",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
# No path arguments: an explicit path overrides `tool.ruff.include`, which is the single list of files.
lint = "ruff check"
format = "ruff format"
format-check = "ruff format --check"
typecheck = "mypy"
# The coverage floors are deliberately not part of `test`, so `test` stays usable on work in progress.
# `cov` is the gate CI and the release workflow run.
cov = [
    "pytest --cov=strands_mongodb --cov-report=term-missing --cov-report=json --cov-fail-under=90 {args}",
    "python scripts/check_module_coverage.py",
]
prepare = ["format", "lint", "typecheck", "test"]

[tool.ruff]
line-length = 120
# scripts/ is included because check_module_coverage.py gates a release.
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py", "examples/**/*.py"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    # %s placeholders in log calls, never an f-string, so a handler formats lazily and a log aggregator
    # sees one message shape. The SDK enforces the same rule.
    "G", # flake8-logging-format
]

[tool.ruff.lint.isort]
# `_support` is `examples/_support.py`, imported by the sibling scripts that live beside it. The
# examples are run as scripts rather than as a package, so the import is bare and ruff has no `src`
# entry that would let it infer first-party. Without this it sorts into the third-party block, above
# `strands_mongodb`, and every example file reports I001.
known-first-party = ["_support"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# Tests are checked too: an unawaited coroutine or a mistyped fixture lets a test pass while asserting
# nothing. `scripts/` gates a release.
files = ["src", "tests", "scripts", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
# Set explicitly because pytest-asyncio warns the default is changing. Each test gets its own client on
# its own loop, so the harness never relies on the client's own loop rebinding, which is under test.
asyncio_default_fixture_loop_scope = "function"
# A typo in a marker name would silently move a test out of its tier. Strict mode makes it a collection
# error.
addopts = "--strict-markers --strict-config"
# A DeprecationWarning fails the suite, so a deprecated API is replaced before it is removed.
#
# Only `DeprecationWarning`, not every warning: the suite also sees a `ResourceWarning` from a client whose
# loop closed under it and a `PytestUnraisableExceptionWarning` from pymongo's periodic executor on a dead
# loop. Neither comes from this package, and nothing it pins can fix them.
filterwarnings = ["error::DeprecationWarning"]
markers = [
    "contract: needs a real MongoDB deployment of any kind. Gated on MONGODB_URI.",
    "integration: needs Atlas or an Atlas CLI local deployment with mongot. Gated on MONGODB_ATLAS_URI.",
    "autoembed: needs a cluster with a registered Atlas embedding model. Gated on MONGODB_AUTOEMBED_URI.",
    "compat: resolves the latest published strands-agents rather than the pinned one. CI cron only.",
    "gate: the release-gate assertion. Reordered to run last, so it sees every other outcome.",
    "example: runs a shipped examples/ script as a subprocess. Carries a tier marker for its backend.",
    "build: builds a wheel from this tree and installs it into an empty venv. Needs network, no deployment. Gated on STRANDS_MONGODB_BUILD_TIER.",
]

[tool.coverage.run]
source = ["strands_mongodb"]
branch = true
# Some tests check import-time behavior in a fresh interpreter. Parallel mode measures those
# subprocesses, so the per-module floor counts the lines they cover.
parallel = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
show_missing = true
